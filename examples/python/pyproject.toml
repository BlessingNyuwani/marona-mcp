[project]
name = "marona-mcp-python-example"
version = "0.1.0"
description = "A production-shaped Marona MCP server example."
requires-python = ">=3.11"
dependencies = ["marona-sdk==0.1.14"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "mypy>=1.15,<2", "pytest>=8,<9", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
